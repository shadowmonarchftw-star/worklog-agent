name: Build Windows Installer

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # npm lockfiles generated on macOS omit electron-builder's Windows-only
        # optional packages, so resolve them on the Windows runner.
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build unpacked Windows app
        run: npm run dist:dir -- --win --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Smoke-test packaged Windows app
        run: node scripts/smoke-packaged-app.cjs "release/win-unpacked/AI Worklog Agent.exe"

      - name: Build Windows installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AI-Worklog-Agent-Windows
          # latest.yml and the blockmap are what electron-updater reads to find
          # and differentially download a new version. Without them the in-app
          # updater cannot see the release at all.
          path: |
            release/*Setup*.exe
            release/*Setup*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 30
