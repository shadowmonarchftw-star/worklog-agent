name: Publish GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows installer
    uses: ./.github/workflows/windows-installer.yml
    permissions:
      contents: read

  macos:
    name: macOS installers
    uses: ./.github/workflows/macos-installer.yml
    permissions:
      contents: read

  release:
    name: Publish installers
    needs:
      - windows
      - macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install runtime dependencies
        run: npm ci --omit=dev

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: AI-Worklog-Agent-*
          path: release
          merge-multiple: true

      - name: Merge macOS update metadata
        shell: bash
        run: |
          node scripts/merge-update-metadata.cjs \
            release/latest-mac.yml \
            release/latest-mac-arm64.yml \
            release/latest-mac-x64.yml
          rm -f release/latest-mac-arm64.yml release/latest-mac-x64.yml
          cat release/latest-mac.yml

      - name: Verify release assets
        shell: bash
        run: |
          test -n "$(find release -maxdepth 1 -type f -name '*.exe' -print -quit)"
          test "$(find release -maxdepth 1 -type f -name '*.dmg' | wc -l)" -eq 2
          # Without this metadata the in-app updater silently never sees the
          # release, which is how v0.3.4 shipped a non-functional updater.
          test -f release/latest.yml
          test -f release/latest-mac.yml
          test "$(find release -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 2

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "AI Worklog Agent $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
