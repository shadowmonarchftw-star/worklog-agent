name: Publish GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows installer
    uses: ./.github/workflows/windows-installer.yml
    permissions:
      contents: read

  macos:
    name: macOS installers
    uses: ./.github/workflows/macos-installer.yml
    permissions:
      contents: read

  release:
    name: Publish installers
    needs:
      - windows
      - macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: AI-Worklog-Agent-*
          path: release
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          test -n "$(find release -maxdepth 1 -type f -name '*.exe' -print -quit)"
          test "$(find release -maxdepth 1 -type f -name '*.dmg' | wc -l)" -eq 2

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "AI Worklog Agent $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
