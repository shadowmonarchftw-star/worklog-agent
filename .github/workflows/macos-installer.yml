name: Build macOS Installers

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }} installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon
            runner: macos-15
            arch: arm64
            unpacked_dir: mac-arm64
          - label: Intel
            runner: macos-15-intel
            arch: x64
            unpacked_dir: mac

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build unpacked macOS app
        run: npm run dist:dir -- --mac --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Smoke-test packaged macOS app
        run: node scripts/smoke-packaged-app.cjs "release/${{ matrix.unpacked_dir }}/AI Worklog Agent.app/Contents/MacOS/AI Worklog Agent"

      - name: Build macOS installer
        run: npm run dist:mac -- --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          NEXT_TELEMETRY_DISABLED: "1"

      # Each runner builds one architecture, so each writes a latest-mac.yml that
      # lists only its own files. They are merged in the release job; renaming
      # here keeps them from overwriting each other on download.
      - name: Name update metadata per architecture
        run: mv release/latest-mac.yml release/latest-mac-${{ matrix.arch }}.yml

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AI-Worklog-Agent-macOS-${{ matrix.arch }}
          # The zip is required: electron-updater's macOS path throws
          # ERR_UPDATER_ZIP_FILE_NOT_FOUND when the metadata lists only a dmg.
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac-${{ matrix.arch }}.yml
          if-no-files-found: error
          retention-days: 30
